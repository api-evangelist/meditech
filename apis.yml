  pricing: unknown
  onboarding: request
  trial: false
  try_now: false
  public: false
  label: Unknown pricing · Registration request required
  confidence: high
  source:
  - https://ehr.meditech.com/ehr-solutions/greenfield-workspace
  - https://greenfield.meditech.com/explorer/topic/welcome
  generated: '2026-07-27'
  method: manual
  note: >-
    MEDITECH publishes no API pricing, no plan tiers, and no rate limits. Sandbox access and the
    ability to execute calls against a real EHR require a Greenfield Workspace registration
    request (an iFiller form) that MEDITECH reviews — it is not self-serve signup. The reference
    documentation itself, however, IS publicly reachable at greenfield.meditech.com/explorer
    without a login. The catch: it is an Angular single-page app that renders entirely
    client-side, and the host serves robots.txt with `Disallow: /`. So the docs are readable by
    a human with a browser but invisible to crawlers, to indexes, and to any AI agent that
    fetches URLs or respects robots — machine-undiscoverable rather than access-controlled.
x-capabilities:
  reviewed: '2026-08-06'
  source: https://greenfield-prod-apis.meditech.com/v2/uscore/STU6/metadata
  previously_reviewed: '2026-07-27'
  previous_source: https://ehr.meditech.com/ehr-solutions/greenfield-workspace-resources
  write_access: two-resources-only
  note: >-
    IMPORTANT for anyone evaluating MEDITECH for agent or integration work. Read from
    MEDITECH's own FHIR CapabilityStatement on 2026-08-06, not inferred from documentation:
    the Greenfield developer program exposes 33 resources, and exactly TWO of them accept
    writes — Communication (create) and QuestionnaireResponse (create, update). Everything
    else is read and search only.
    In particular: Appointment supports read and search-type but NEITHER create NOR update,
    and Patient supports read and search-type with NO create. So there is no supported public
    path to book an appointment, reschedule one, or register a patient. A read-only grant is
    the expected outcome of applying, not a sign of applying to the wrong program.
    CORRECTION: this block previously stated MEDITECH exposes NO write surface at all. That
    was inferred from the Greenfield resources page rather than read from the contract. It was
    wrong in detail — a narrow write surface does exist — though the practical conclusion for
    scheduling and patient creation is unchanged. See
    conformance/meditech-greenfield-conformance.yml for the full resource and interaction table.
  contract_vs_marketing: >-
    The Greenfield resources page lists FHIR Scheduling as "coming soon" and Expanse-only,
    while the live CapabilityStatement already exposes Appointment for read and search. The
    published contract and the marketing page disagree; the contract is the one an integrator
    can act on.
  surfaces:
  - name: FHIR Patient Access API (DSTU2)
    access: read-only
    workflow: patient-facing
    data: Common Clinical Data Set
    availability: all customers
    docs: https://greenfield.meditech.com/explorer/topic/patient-health-data
  - name: FHIR Patient Access API (R4 / US Core)
    access: read-only
    workflow: patient-facing
    data: USCDI R4
    availability: all customers
    docs: https://greenfield.meditech.com/explorer/topic/USCore-patient-health-data
  - name: HL7v2 Outbound Interfaces
    access: read-only
    workflow: outbound only (ADT, lab results, medications, orders)
    availability: all customers
    docs: https://ehr.meditech.com/hl7-outbound-list-for-greenfield
  - name: FHIR Scheduling APIs
    access: not yet available
    status: coming soon
    availability: MEDITECH Expanse customers only
    note: >-
      MEDITECH's marketing describes Expanse scheduling write-back (Argo-Scheduling, FHIR STU3 —
      retrieve slots, book visits, manage provider availability) and partners such as Luma Health
      have shipped it. That is delivered through customer-sponsored or formal-partner integration
      at the hospital, NOT through self-serve Greenfield access. Greenfield itself still lists
      FHIR Scheduling as "coming soon".
x-provenance:
  reviewed: '2026-07-27'
  reviewed_by: Kin Lane
  openapi_origin: api-evangelist-derived
  note: >-
    The OpenAPI definitions in this repo are API Evangelist models of the US Core FHIR R4
    profile that MEDITECH states it supports. They are NOT MEDITECH-published contracts —
    MEDITECH does not publish an OpenAPI. Its authoritative reference is the Greenfield API
    Explorer at https://greenfield.meditech.com/explorer, which is publicly reachable but
    client-rendered and robots-disallowed, so it cannot be fetched or crawled — it has to be
    read in a browser. The `{facility}` server template reflects the per-customer deployment
    model; actual service base URLs are issued per organization. Authentication, scopes, and
    agentic-access artifacts here are derived FROM these models, so they inherit the same
    derived provenance. Treat all of it as a starting scaffold to reconcile against the
    Explorer, not as an authoritative interface contract.
  authoritative_reference: https://greenfield.meditech.com/explorer/topic/welcome
  explorer_sections:
  - https://greenfield.meditech.com/explorer/topic/welcome
  - https://greenfield.meditech.com/explorer/topic/patient-health-data
  - https://greenfield.meditech.com/explorer/topic/USCore-patient-health-data
  - https://greenfield.meditech.com/explorer/api
  - https://greenfield.meditech.com/explorer/endpoints
  - https://greenfield.meditech.com/explorer/scope
  - https://greenfield.meditech.com/explorer/authorization
  - https://greenfield.meditech.com/explorer/status-codes
  explorer_sections_note: >-
    Route list confirmed from the Explorer's shipped Angular bundle (main.*.js), not guessed.
    /explorer/endpoints and /explorer/scope are the two that matter most for reconciliation —
    they are MEDITECH's own endpoint directory and scope list, and should supersede the derived
    scopes/ and openapi/ artifacts in this repo once someone transcribes them.
