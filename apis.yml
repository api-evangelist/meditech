aid: meditech
name: MEDITECH
type: Index
specificationVersion: '0.23'
description: >-
  MEDITECH (Medical Information Technology, Inc.) is an electronic health record vendor serving
  community hospitals and health systems, primarily through its MEDITECH Expanse platform. Its
  API program is delivered through the Greenfield Workspace — a registration-gated developer
  environment where approved app developers get interactive documentation and a sandbox to
  execute APIs against a real MEDITECH EHR. Published surfaces are US Core FHIR R4 (view-only
  patient-facing data, USCDI v1, DSTU2/R4 compatible) and FHIR Scheduling APIs. MEDITECH also
  operates Traverse Exchange, its national data exchange network and TEFCA on-ramp, connecting
  700+ facilities across 41 US states plus Canadian deployments.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/meditech.png
url: https://raw.githubusercontent.com/api-evangelist/meditech/refs/heads/main/apis.yml
tags:
