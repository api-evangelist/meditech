notable:
  - >-
    Appointment is present and supports read and search-type. The Greenfield resources page
    still lists FHIR Scheduling as "coming soon" and Expanse-only. The contract and the
    marketing page disagree; the contract is the one an integrator can act on.
  - >-
    Appointment supports NEITHER create NOR update, so booking and rescheduling are not
    reachable through this program regardless of what the scheduling roadmap says.
  - >-
    Patient supports read and search-type only. There is no create, so an application cannot
    register a patient through this API.
  - >-
    /metadata answers anonymously (HTTP 200, 51,718 bytes) while /Patient returns HTTP 401 on
    the same host, which is what makes the 200 meaningful rather than a catch-all handler.
